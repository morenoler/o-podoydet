# Дополняет основной application.yml только в тестах (classpath:/config/ имеет приоритет).
spring:
  datasource:
    # По умолчанию — одноразовый PostgreSQL в Docker через Testcontainers.
    # Без Docker: TEST_DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/opodoydet_test
    url: ${TEST_DATABASE_URL:jdbc:tc:postgresql:16-alpine:///opodoydet}
    username: ${TEST_DATABASE_USER:test}
    password: ${TEST_DATABASE_PASSWORD:test}

catalog:
  # Импорт запускают сами тесты, которым он нужен.
  import-on-startup: false
  data-path: ../data/verified-hotels.json

knowledge:
  resolve-interval: PT24H
